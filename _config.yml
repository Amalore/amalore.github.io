title: "Marie Amalore Nambi"
name: "Marie Amalore Nambi"
description: >-
  Academic website of Marie Amalore Nambi, a postdoctoral researcher in
  commutative algebra and algebraic combinatorics at Sabancı University.
url: "https://amalore.github.io"
baseurl: ""
repository: "Amalore/amalore.github.io"
locale: "en-US"
encoding: "utf-8"

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "aqua"
masthead_title: "Marie Amalore Nambi"
search: false
breadcrumbs: false

# Site author
author:
  name: "Marie Amalore Nambi"
  avatar: "/images/profile.jpg"
  bio: "Postdoctoral Researcher in Mathematics"
  location: "Sabancı University · Istanbul, Türkiye"
  email: "amalore.pushparaj@sabanciuniv.edu"
  links:
    - label: "Google Scholar"
      icon: "fas fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=MZbDLuIAAAAJ&hl=en"
    - label: "arXiv"
      icon: "fas fa-file-alt"
      url: "https://arxiv.org/a/amalorenambi_m_1.html"
    - label: "Scopus"
      icon: "fas fa-database"
      url: "https://www.scopus.com/authid/detail.uri?authorId=57902619400"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/Amalore"

footer:
  links:
    - label: "Google Scholar"
      icon: "fas fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=MZbDLuIAAAAJ&hl=en"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/Amalore"

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      share: false

include:
  - _pages

plugins:
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

atom_feed:
  hide: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

google_site_verification: "tdV_9i-0jSC9mJ5l2rpZwCpxPhT2SN1wEA0E80ntTjI"
